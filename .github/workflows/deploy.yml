# ============================================================
#  Platform_Design — GitHub Actions Workflow
#  Trigger: push a main
#  Acciones: valida el schema SQLite y verifica los archivos
#            de datos, listos para revisión del profesor.
# ============================================================

name: Deploy Skeleton

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-schema:
    name: Validate Database Schema
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SQLite
        run: sudo apt-get install -y sqlite3

      - name: Create database from schema
        run: |
          sqlite3 platform.db < db_files/esau/schema.sql
          echo "Schema applied successfully"

      - name: Load sample data
        run: |
          sqlite3 platform.db < db_files/esau/sample_data.sql
          echo "Sample data loaded successfully"

      - name: Verify tables exist
        run: |
          sqlite3 platform.db ".tables"
          echo "Table count:"
          sqlite3 platform.db "SELECT COUNT(*) FROM sqlite_master WHERE type='table';"

      - name: Verify task data (Assignment Submission Tracker)
        run: |
          echo "--- Tasks by priority ---"
          sqlite3 platform.db "SELECT priority, COUNT(*) as total FROM tasks GROUP BY priority ORDER BY total DESC;"
          echo "--- Tasks by difficulty ---"
          sqlite3 platform.db "SELECT difficulty, COUNT(*) as total FROM tasks GROUP BY difficulty ORDER BY total DESC;"
          echo "--- Tasks by status ---"
          sqlite3 platform.db "SELECT status, COUNT(*) as total FROM tasks GROUP BY status ORDER BY total DESC;"

  validate-data-files:
    name: Validate Sample Data Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check CSV file exists and has content
        run: |
          if [ ! -f "db_files/dalila/data/tasks_sample.csv" ]; then
            echo "ERROR: tasks_sample.csv not found"
            exit 1
          fi
          LINES=$(wc -l < db_files/dalila/data/tasks_sample.csv)
          echo "CSV lines: $LINES"

      - name: Check JSON file is valid
        run: |
          if [ ! -f "db_files/dalila/data/tasks_sample.json" ]; then
            echo "ERROR: tasks_sample.json not found"
            exit 1
          fi
          python3 -c "import json; data=json.load(open('db_files/dalila/data/tasks_sample.json')); print(f'JSON valid — {len(data[\"tasks\"])} tasks')"

      - name: Run data generation script
        run: |
          pip install faker --quiet
          cd db_files
          python3 generate_data.py
          echo "Data generation script OK"

  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [validate-schema, validate-data-files]

    steps:
      - name: Print summary
        run: |
          echo "============================================="
          echo "  Platform_Design — Skeleton Verified"
          echo "  Team: TeamX UPY 2026"
          echo "  All checks passed — ready for review"
          echo "============================================="
