<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestor de Proyectos — Formularios</title>
  <!-- Autor: Gael Perez | Rol: Frontend / Diseño de Formulario -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      gap: 32px;
      flex-wrap: wrap;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.1);
      padding: 32px;
      width: 100%;
      max-width: 480px;
    }
    .card h2 {
      font-size: 1.25rem;
      color: #1a1a2e;
      margin-bottom: 24px;
      border-bottom: 3px solid #4361ee;
      padding-bottom: 10px;
    }
    label { display: block; font-size: .85rem; font-weight: 600; color: #444; margin-bottom: 4px; }
    input, textarea, select {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: .95rem;
      transition: border-color .2s;
      outline: none;
      margin-bottom: 16px;
    }
    input:focus, textarea:focus, select:focus { border-color: #4361ee; }
    textarea { resize: vertical; min-height: 80px; }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    .badge-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: .8rem;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .badge.low      { background: #d1fae5; color: #065f46; }
    .badge.medium   { background: #fef3c7; color: #92400e; }
    .badge.high     { background: #fee2e2; color: #991b1b; }
    .badge.critical { background: #fce7f3; color: #9d174d; }
    .badge.selected { border-color: #4361ee; }
    .btn {
      width: 100%;
      padding: 12px;
      background: #4361ee;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }
    .btn:hover { background: #3451d1; }
    .btn.secondary {
      background: #fff;
      color: #4361ee;
      border: 2px solid #4361ee;
      margin-top: 10px;
    }
    .btn.secondary:hover { background: #eef0fd; }
    .tag-input-row { display: flex; gap: 8px; }
    .tag-input-row input { margin-bottom: 0; }
    .tag-input-row button {
      padding: 10px 16px;
      background: #4361ee;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      font-size: .9rem;
    }
    .tags-display { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; margin-bottom: 16px; }
    .tag-chip {
      background: #eef0fd;
      color: #4361ee;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: .8rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tag-chip span { cursor: pointer; color: #999; }
  </style>
</head>
<body>

<!-- FORMULARIO 1: CREAR PROYECTO -->
<div class="card">
  <h2>Nuevo Proyecto</h2>
  <form id="formProject" onsubmit="submitProject(event)">

    <label for="proj-name">Nombre del proyecto *</label>
    <input type="text" id="proj-name" placeholder="Ej. Plataforma Web Equipo Yucateco" required />

    <label for="proj-desc">Descripción</label>
    <textarea id="proj-desc" placeholder="¿De qué trata el proyecto?"></textarea>

    <label>Prioridad</label>
    <div class="badge-row" id="proj-priority">
      <div class="badge low"      onclick="selectPriority(this,'low')">Baja</div>
      <div class="badge medium selected" onclick="selectPriority(this,'medium')">Media</div>
      <div class="badge high"     onclick="selectPriority(this,'high')">Alta</div>
      <div class="badge critical" onclick="selectPriority(this,'critical')">Crítica</div>
    </div>
    <input type="hidden" id="proj-priority-val" value="medium" />

    <div class="row">
      <div>
        <label for="proj-start">Fecha inicio</label>
        <input type="date" id="proj-start" />
      </div>
      <div>
        <label for="proj-due">Fecha límite</label>
        <input type="date" id="proj-due" />
      </div>
    </div>

    <label for="proj-status">Estado</label>
    <select id="proj-status">
      <option value="active">Activo</option>
      <option value="on_hold">En pausa</option>
      <option value="completed">Completado</option>
      <option value="cancelled">Cancelado</option>
    </select>

    <button type="submit" class="btn">Crear Proyecto</button>
    <button type="reset" class="btn secondary">Limpiar</button>
  </form>
</div>

<!-- FORMULARIO 2: CREAR TAREA -->
<div class="card">
  <h2>Nueva Tarea</h2>
  <form id="formTask" onsubmit="submitTask(event)">

    <label for="task-project">Proyecto *</label>
    <select id="task-project" required>
      <option value="">-- Selecciona un proyecto --</option>
      <option value="1">Plataforma Web Equipo Yucateco</option>
      <option value="2">Rediseño de API REST</option>
      <option value="3">Migración de Base de Datos</option>
    </select>

    <label for="task-title">Título de la tarea *</label>
    <input type="text" id="task-title" placeholder="Ej. Diseñar formulario de login" required />

    <label for="task-desc">Descripción</label>
    <textarea id="task-desc" placeholder="Detalla qué hay que hacer..."></textarea>

    <label>Prioridad</label>
    <div class="badge-row" id="task-priority">
      <div class="badge low"      onclick="selectTaskPriority(this,'low')">Baja</div>
      <div class="badge medium selected" onclick="selectTaskPriority(this,'medium')">Media</div>
      <div class="badge high"     onclick="selectTaskPriority(this,'high')">Alta</div>
      <div class="badge critical" onclick="selectTaskPriority(this,'critical')">Crítica</div>
    </div>
    <input type="hidden" id="task-priority-val" value="medium" />

    <label for="task-status">Estado</label>
    <select id="task-status">
      <option value="todo">Por hacer</option>
      <option value="in_progress">En progreso</option>
      <option value="in_review">En revisión</option>
      <option value="done">Completada</option>
    </select>

    <div class="row">
      <div>
        <label for="task-due">Fecha límite</label>
        <input type="date" id="task-due" />
      </div>
      <div>
        <label for="task-hours">Horas estimadas</label>
        <input type="number" id="task-hours" min="0.5" step="0.5" placeholder="4.0" />
      </div>
    </div>

    <label for="task-assignee">Asignar a</label>
    <select id="task-assignee">
      <option value="">-- Sin asignar --</option>
      <option value="1">Dalila Ku</option>
      <option value="2">Esau Palomo</option>
      <option value="3">Yeimi Piste</option>
      <option value="4">Gael Perez</option>
      <option value="5">Ingrid Castillo</option>
    </select>

    <label>Etiquetas</label>
    <div class="tag-input-row">
      <input type="text" id="tag-input" placeholder="Ej. backend" />
      <button type="button" onclick="addTag()">+ Agregar</button>
    </div>
    <div class="tags-display" id="tags-display"></div>

    <button type="submit" class="btn">Crear Tarea</button>
    <button type="reset" class="btn secondary" onclick="clearTags()">Limpiar</button>
  </form>
</div>

<script>
  const tags = [];

  function selectPriority(el, val) {
    document.querySelectorAll('#proj-priority .badge').forEach(b => b.classList.remove('selected'));
    el.classList.add('selected');
    document.getElementById('proj-priority-val').value = val;
  }

  function selectTaskPriority(el, val) {
    document.querySelectorAll('#task-priority .badge').forEach(b => b.classList.remove('selected'));
    el.classList.add('selected');
    document.getElementById('task-priority-val').value = val;
  }

  function addTag() {
    const input = document.getElementById('tag-input');
    const val = input.value.trim().toLowerCase();
    if (!val || tags.includes(val)) { input.value = ''; return; }
    tags.push(val);
    renderTags();
    input.value = '';
  }

  function removeTag(t) {
    const i = tags.indexOf(t);
    if (i > -1) tags.splice(i, 1);
    renderTags();
  }

  function renderTags() {
    const container = document.getElementById('tags-display');
    container.innerHTML = tags.map(t =>
      `<div class="tag-chip">${t} <span onclick="removeTag('${t}')">×</span></div>`
    ).join('');
  }

  function clearTags() { tags.length = 0; renderTags(); }

  function submitProject(e) {
    e.preventDefault();
    const data = {
      name:       document.getElementById('proj-name').value,
      description:document.getElementById('proj-desc').value,
      priority:   document.getElementById('proj-priority-val').value,
      status:     document.getElementById('proj-status').value,
      start_date: document.getElementById('proj-start').value,
      due_date:   document.getElementById('proj-due').value,
    };
    alert('Proyecto listo para enviar:\n' + JSON.stringify(data, null, 2));
  }

  function submitTask(e) {
    e.preventDefault();
    const data = {
      project_id:      document.getElementById('task-project').value,
      title:           document.getElementById('task-title').value,
      description:     document.getElementById('task-desc').value,
      priority:        document.getElementById('task-priority-val').value,
      status:          document.getElementById('task-status').value,
      due_date:        document.getElementById('task-due').value,
      estimated_hours: document.getElementById('task-hours').value,
      assigned_to:     document.getElementById('task-assignee').value,
      tags:            [...tags],
    };
    alert('Tarea lista para enviar:\n' + JSON.stringify(data, null, 2));
  }
</script>
</body>
</html>
